services:
  - type: web
    name: asklep-backend
    runtime: docker
    plan: free
    region: virginia
    branch: dev
    autoDeploy: true
    healthCheckPath: /hospital-case-backend/api/public/catalog
    envVars:
      - key: FRONTEND_URL
        value: https://asklep-roberto-dev1.vercel.app
      - key: APP_URL
        value: https://asklep-roberto-dev1.vercel.app/hospital-case-backend
